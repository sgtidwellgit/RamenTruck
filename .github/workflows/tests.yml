name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests (optional-extra tests skip)
        run: python -m pytest -q -rs

  extras:
    name: all extras / ubuntu-latest / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install every optional extra
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the sentence-transformers install small
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,all]"
      - name: Run tests (nothing should skip)
        run: python -m pytest -q -rs

  build:
    name: Build and install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel and import it
        run: |
          python -m pip install dist/*.whl
          cd /tmp && python -c "import ramentruck; print(ramentruck.__version__)"
